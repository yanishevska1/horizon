<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Обрій — плани на роки: довгі життєві задачі на одній шкалі часу.">
<meta property="og:title" content="Обрій">
<meta property="og:description" content="Плани на роки: довгі життєві задачі на одній шкалі часу.">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}
body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}
</style>
<title>Обрій</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-screen planner — header with scenario tabs, then a full-width board of unnamed tracks; each task is a named "snake" that can share a track with tasks before/after it */
:root{
  --bg:#ECEEEA; --surface:#FAFBF8; --surface-2:#F2F4EF; --fg:#1C2220; --muted:#66706B; --line:#D8DDD6; --row-alt:rgba(28,34,32,.022);
  --grid-day:rgba(28,34,32,.05); --grid-month:rgba(28,34,32,.14); --grid-year:rgba(28,34,32,.38);
  --past:rgba(28,34,32,.075); --accent:#3352D1; --accent-ink:#FFFFFF; --link:#7A8580; --warn:#C24A2C; --sun:#C98A12;
  --shadow:0 10px 30px rgba(20,30,25,.14),0 2px 6px rgba(20,30,25,.08);
  --c0:#1F8A84; --c1:#D08C22; --c2:#8A4FA8; --c3:#2F7FD0; --c4:#D45E48; --c5:#6E8B2F; --c6:#9A6B3F; --c7:#C24C7E;
  --font-ui:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans',sans-serif;
  --font-display:'Unbounded','Onest',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
  --lh:54px; --ruler-h:62px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]):not([data-ui="light"]){
  --bg:#111418; --surface:#171B20; --surface-2:#1C2127; --fg:#E5E8EB; --muted:#949CA5; --line:#29303A; --row-alt:rgba(229,232,235,.018);
  --grid-day:rgba(229,232,235,.045); --grid-month:rgba(229,232,235,.11); --grid-year:rgba(229,232,235,.30);
  --past:rgba(0,0,0,.3); --accent:#7F9BFF; --accent-ink:#0F1420; --link:#7E8893; --warn:#FF8A66; --sun:#F2C35B;
  --shadow:0 12px 34px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.35);
  --c0:#4FC7BE; --c1:#F0B458; --c2:#BC8BD8; --c3:#6CAEF0; --c4:#F08B75; --c5:#A6C45E; --c6:#D5A574; --c7:#EC84B0;
  color-scheme:dark}}
:root[data-theme="dark"]:not([data-ui="light"]),:root[data-ui="dark"]{
  --bg:#111418; --surface:#171B20; --surface-2:#1C2127; --fg:#E5E8EB; --muted:#949CA5; --line:#29303A; --row-alt:rgba(229,232,235,.018);
  --grid-day:rgba(229,232,235,.045); --grid-month:rgba(229,232,235,.11); --grid-year:rgba(229,232,235,.30);
  --past:rgba(0,0,0,.3); --accent:#7F9BFF; --accent-ink:#0F1420; --link:#7E8893; --warn:#FF8A66; --sun:#F2C35B;
  --shadow:0 12px 34px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.35);
  --c0:#4FC7BE; --c1:#F0B458; --c2:#BC8BD8; --c3:#6CAEF0; --c4:#F08B75; --c5:#A6C45E; --c6:#D5A574; --c7:#EC84B0;
  color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:14px;overflow:hidden}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{height:100%;display:flex;flex-direction:column;gap:10px;box-sizing:border-box;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-width:0}
.brand{font-family:var(--font-display);font-weight:600;font-size:15px;letter-spacing:.01em;white-space:nowrap;display:flex;align-items:center;gap:8px}
:lang(zh) .brand,:lang(ko) .brand,:lang(fa) .brand{font-family:var(--font-ui);font-weight:700}
.brand svg{width:20px;height:20px;flex:none}
.tabs{display:flex;align-items:center;gap:4px;min-width:0;flex:1 1 260px;overflow-x:auto;scrollbar-width:none;padding:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{border:1px solid transparent;background:transparent;border-radius:8px;padding:6px 12px;cursor:pointer;white-space:nowrap;color:var(--muted);font-weight:500}
.tab:hover{background:var(--surface-2);color:var(--fg)}
.tab.on{background:var(--surface);border-color:var(--line);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.tab-add{width:30px;height:30px;border-radius:8px;border:1px dashed var(--line);background:transparent;cursor:pointer;color:var(--muted);font-size:18px;line-height:1;flex:none}
.tab-add:hover{color:var(--fg);border-color:var(--muted)}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seg-ctl{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:2px}
.seg-ctl button{border:0;background:transparent;padding:5px 9px;border-radius:7px;cursor:pointer;color:var(--muted);font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.seg-ctl button:hover{color:var(--fg)}
.seg-ctl button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.theme-ctl button{display:grid;place-items:center;padding:5px 7px}
.theme-ctl svg{width:16px;height:16px}
.theme-ctl button.on .i-sun{color:var(--sun)}
.theme-ctl button.on .i-moon{color:var(--accent)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 12px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.today{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.btn.add{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.add:hover{filter:brightness(1.08)}
.icon-btn{width:32px;height:32px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);border-radius:9px;cursor:pointer;color:var(--muted)}
.icon-btn:hover{color:var(--fg);border-color:var(--muted)}
.icon-btn svg{width:16px;height:16px}
.lang{appearance:none;-webkit-appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 26px 6px 10px;cursor:pointer;font-size:13px;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:right 12px center,right 8px center;background-size:4px 4px;background-repeat:no-repeat}
[dir="rtl"] .lang{padding:6px 10px 6px 26px;background-position:left 8px center,left 12px center}
.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.status i{width:7px;height:7px;border-radius:50%;background:var(--c5)}
.status.saving i{background:var(--c1)}
.status.local i{background:var(--warn)}
.status.pending i{background:var(--muted)}
.status.device i{background:var(--warn)}
.status.device{cursor:pointer}
.acct{display:flex;align-items:center;gap:7px;max-width:200px}
.acct span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct .av{width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.acct.guest{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.consent{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:45;background:var(--surface);color:var(--fg);border:1px solid var(--line);
  border-radius:14px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow);max-width:calc(100% - 32px);font-size:13px;flex-wrap:wrap}
.consent .btn{padding:5px 12px}

/* Board — time always runs left to right, also in right-to-left languages */
.board{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;
  user-select:none;-webkit-user-select:none;touch-action:none;position:relative;direction:ltr}
.ruler{position:relative;height:var(--ruler-h);flex:none;border-bottom:1px solid var(--line);overflow:hidden;cursor:grab;font-variant-numeric:tabular-nums;background:var(--surface-2)}
.ruler span{position:absolute;white-space:nowrap;overflow:hidden;box-sizing:border-box}
.ry{top:0;height:22px;line-height:22px;padding-left:8px;font-family:var(--font-display);font-size:12px;font-weight:600;border-left:1.5px solid var(--grid-year)}
.rm{top:22px;height:20px;line-height:20px;text-align:center;font-size:12px;color:var(--muted);border-left:1px solid var(--grid-month)}
.rd{top:42px;height:18px;line-height:18px;font-family:var(--font-mono);font-size:10px;color:var(--muted);text-align:center}
.rp{top:0;bottom:0;left:0;background:var(--past);pointer-events:none}
.ry.past,.rm.past,.rd.past{color:var(--muted);opacity:.75}
.seg.past,.above.past{opacity:.55}
.rt{top:42px;height:18px;line-height:18px;transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);border-radius:9px;padding:0 8px;font-size:11px;font-weight:600;overflow:visible!important}

.body{position:relative;flex:1;min-height:0}
#grid{position:absolute;left:0;top:0;pointer-events:none}
.scroller{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin}
.rows{position:relative}
.row{position:relative;height:var(--lh);box-sizing:border-box;border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent);overflow:hidden;cursor:grab}
.row:nth-child(even){background:var(--row-alt)}
.row.ghost{border-bottom-style:dashed;background:transparent}

.seg{position:absolute;top:22px;height:24px;cursor:grab;border-radius:7px}
.seg:hover{box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 25%,transparent)}
.seg.lifted{box-shadow:var(--shadow);z-index:3}
.seg.follows{box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 45%,transparent)}
.pc{position:absolute;top:0;bottom:0;box-sizing:border-box}
.pc.solid{background:color-mix(in srgb,var(--c) 32%,var(--surface));border-top:1.5px solid var(--c);border-bottom:1.5px solid var(--c)}
.pc.solid.first{border-left:1.5px solid var(--c)}
.pc.solid.last{border-right:1.5px solid var(--c)}
.pc.dash{
  background:
    linear-gradient(90deg,var(--c) 0 9px,transparent 9px 13px,var(--c) 13px 15px,transparent 15px 19px) 0 0/19px 2px repeat-x,
    linear-gradient(90deg,var(--c) 0 9px,transparent 9px 13px,var(--c) 13px 15px,transparent 15px 19px) 0 100%/19px 2px repeat-x,
    color-mix(in srgb,var(--c) 9%,transparent)}
.pc.dash.first{border-left:1.5px dotted var(--c)}
.pc.dash.last{border-right:1.5px dotted var(--c)}
.pc.first{border-top-left-radius:7px;border-bottom-left-radius:7px}
.pc.last{border-top-right-radius:7px;border-bottom-right-radius:7px}
.seg .txt{position:absolute;top:0;bottom:0;display:flex;align-items:center;gap:8px;white-space:nowrap;overflow:hidden;pointer-events:none;color:var(--fg)}
.seg .txt b{font-weight:600;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;unicode-bidi:plaintext}
.seg .txt em{font-style:normal;font-family:var(--font-mono);font-size:11px;color:var(--muted)}
.above{position:absolute;top:4px;height:16px;line-height:16px;font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  color:color-mix(in srgb,var(--c) 70%,var(--fg));cursor:grab;padding-right:2px;unicode-bidi:plaintext}
.above::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--c);margin-right:5px;vertical-align:1px}
.h{position:absolute;top:-3px;bottom:-3px;width:12px;cursor:ew-resize;z-index:2}
.h-l{left:-5px}.h-r{right:-5px}
.h-m{width:14px;margin-left:-7px;cursor:col-resize}
.h-m::after{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;border-radius:1px;background:var(--c);opacity:0;transition:opacity .15s}
.seg:hover .h-m::after{opacity:.9}
.h-l::after,.h-r::after{content:"";position:absolute;top:6px;bottom:6px;width:3px;border-radius:2px;background:var(--c);opacity:0;transition:opacity .15s}
.h-l::after{left:4px}.h-r::after{right:4px}
.seg:hover .h-l::after,.seg:hover .h-r::after{opacity:.8}
.board.linking .seg,.board.linking .above{cursor:crosshair}
.seg.src{box-shadow:0 0 0 3px var(--accent)}
.edge{position:absolute;top:22px;height:24px;max-width:42%;display:flex;align-items:center;gap:4px;padding:0 9px;border-radius:12px;cursor:pointer;
  border:1px solid color-mix(in srgb,var(--c) 45%,var(--line));background:var(--surface);color:var(--fg);font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;z-index:4;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.edge span{overflow:hidden;text-overflow:ellipsis;unicode-bidi:plaintext}
.edge i{font-style:normal;color:var(--c);font-weight:700}
.edge.el{left:6px}.edge.er{right:6px}
.edge:hover{border-color:var(--c)}
.empty{position:absolute;left:0;right:0;top:36px;text-align:center;color:var(--muted);pointer-events:none;padding:0 16px}
.empty strong{display:block;color:var(--fg);font-size:15px;margin-bottom:4px}
#links{position:absolute;left:0;top:0;pointer-events:none;overflow:hidden}
#links path{fill:none;stroke:var(--link);stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round}
#links path.bad{stroke:var(--warn);stroke-dasharray:4 3}
#links .ah{fill:var(--link)} #links .ah-bad{fill:var(--warn)}

/* Floating UI */
.menu{position:fixed;z-index:50;min-width:230px;max-width:min(340px,calc(100vw - 16px));background:var(--surface);border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow);padding:5px;display:flex;flex-direction:column}
.menu .mh{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 10px 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu button{border:0;background:transparent;text-align:start;padding:8px 10px;border-radius:7px;cursor:pointer;display:flex;gap:10px;align-items:center}
.menu button:hover,.menu button:focus-visible{background:var(--surface-2)}
.menu button:disabled{color:var(--muted);cursor:default;background:transparent}
.menu button.danger{color:var(--warn)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
.tip{position:fixed;z-index:40;pointer-events:none;background:var(--fg);color:var(--surface);font-family:var(--font-mono);font-size:11px;padding:5px 8px;border-radius:6px;white-space:nowrap;font-variant-numeric:tabular-nums}
.editor{position:fixed;z-index:60;font:600 13px var(--font-ui);color:var(--fg);background:var(--surface);border:1.5px solid var(--accent);border-radius:7px;padding:0 8px;box-sizing:border-box;outline:none;box-shadow:var(--shadow);unicode-bidi:plaintext}
.chip{position:absolute;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--fg);color:var(--surface);border-radius:20px;padding:8px 8px 8px 16px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);max-width:calc(100% - 32px);font-size:13px}
.chip span{unicode-bidi:plaintext}
.chip button{border:0;background:color-mix(in srgb,var(--surface) 18%,transparent);color:inherit;border-radius:14px;padding:5px 12px;cursor:pointer;font-weight:600;white-space:nowrap}
.modal{position:fixed;inset:0;z-index:70;background:rgba(10,14,12,.35);display:grid;place-items:center;padding:16px}
.dialog{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:20px;width:min(380px,100%);box-sizing:border-box;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 32px);overflow:auto}
.dialog h2{margin:0;font-family:var(--font-display);font-size:16px;font-weight:600}
:lang(zh) .dialog h2,:lang(ko) .dialog h2,:lang(fa) .dialog h2{font-family:var(--font-ui);font-weight:700}
.dialog .sub{margin:-6px 0 0;color:var(--muted);font-size:13px}
.dialog label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);font-weight:500}
.dialog input,.dialog select{font:14px var(--font-mono);color:var(--fg);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.dialog select{font-family:var(--font-ui);font-size:13px;padding:8px 6px}
.dialog .err{margin:0;color:var(--warn);font-size:13px}
.dialog fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.dialog legend{font-size:12px;color:var(--muted);font-weight:500;padding:0;margin-bottom:5px}
.pieces{display:flex;flex-direction:column;gap:6px}
.pr{display:grid;grid-template-columns:minmax(0,1fr) 118px 30px;gap:6px;align-items:center}
.pr .from{font-size:13px;color:var(--muted);padding-inline-start:2px}
.pr input{min-width:0}
.pr .rm{width:30px;height:34px;border:0;background:transparent;color:var(--muted);cursor:pointer;border-radius:7px;font-size:16px}
.pr .rm:hover{background:var(--surface-2);color:var(--warn)}
.add-piece{align-self:flex-start;border:0;background:transparent;color:var(--accent);cursor:pointer;padding:4px 2px;font-weight:500;font-size:13px}
.dialog .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.help{position:fixed;z-index:55;width:min(380px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:14px 16px}
.help h3{margin:0 0 8px;font-size:13px;font-weight:600}
.help dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13px}
.help dt{font-family:var(--font-mono);font-size:11px;color:var(--muted);padding-top:2px;white-space:nowrap}
.help dd{margin:0}
@media (max-width:640px){
  .brand span{display:none}
  .tools{width:100%;justify-content:space-between}
  .status span{display:none}
  .h{width:16px}.h-l{left:-7px}.h-r{right:-7px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div class="app">
  <header>
    <div class="brand"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="1" y="4" width="11" height="3" rx="1.5" fill="var(--c0)"/><rect x="6" y="9" width="12" height="3" rx="1.5" fill="var(--c3)"/><rect x="3" y="14" width="8" height="3" rx="1.5" fill="none" stroke="var(--c1)" stroke-width="1.2" stroke-dasharray="3 1.5 1 1.5"/></svg><span data-t="appName">Обрій</span></div>
    <nav class="tabs" id="tabs"></nav>
    <div class="tools">
      <button class="btn add" id="addBtn" data-t="addTask">+ Задача</button>
      <div class="seg-ctl" id="zoom" role="group">
        <button data-d="91" data-z="0"></button><button data-d="182" data-z="1"></button><button data-d="365" data-z="2"></button><button data-d="730" data-z="3"></button><button data-d="1826" data-z="4"></button>
      </div>
      <button class="btn today" id="todayBtn" data-t="today">Сьогодні</button>
      <div class="status pending" id="status"><i></i><span></span></div>
      <select class="lang" id="lang"></select>
      <div class="seg-ctl theme-ctl" role="group">
        <button id="thLight"><svg class="i-sun" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="8" cy="8" r="3"/><path d="M8 1.2v1.6M8 13.2v1.6M1.2 8h1.6M13.2 8h1.6M3.2 3.2l1.1 1.1M11.7 11.7l1.1 1.1M3.2 12.8l1.1-1.1M11.7 4.3l1.1-1.1"/></svg></button>
        <button id="thDark"><svg class="i-moon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M13.5 9.6A5.8 5.8 0 0 1 6.4 2.5a5.8 5.8 0 1 0 7.1 7.1Z" stroke-linejoin="round"/></svg></button>
      </div>

(() => {
'use strict';
/* ---------- language ---------- */
const LANGS = ['en','uk','es','zh','ko','fa'];
const LOCALE = {en:'en-US', uk:'uk-UA', es:'es-ES', zh:'zh-CN', ko:'ko-KR', fa:'fa-IR-u-ca-gregory-nu-arabext'};
const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
const lsSet = (k,v) => { try { localStorage.setItem(k,v); } catch {} };
const LS_DATA = 'life-timeline-data-v1', LS_PREF = 'life-timeline-prefs-v1';
const prefs = (() => { try { return JSON.parse(lsGet(LS_PREF)) || {}; } catch { return {}; } })();
function detectLang(){
  const list = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || 'en'];
  for (const tag of list){ const base = String(tag).toLowerCase().split('-')[0]; if (LANGS.includes(base)) return base; }
  return 'en';
}
let lang = LANGS.includes(prefs.lang) ? prefs.lang : detectLang();
let T = I18N[lang];

/* ---------- dates (integer day numbers, UTC-based, end is exclusive) ---------- */
const DAY = 86400000;
const UK_MON = ['січ','лют','бер','кві','тра','чер','лип','сер','вер','жов','лис','гру'];
const dn = (y,m,d) => Math.round(Date.UTC(y,m,d)/DAY);
const dd = n => { const t = new Date(n*DAY); return {y:t.getUTCFullYear(), m:t.getUTCMonth(), d:t.getUTCDate()}; };
const _now = new Date();
const TODAY = dn(_now.getFullYear(), _now.getMonth(), _now.getDate());
const iso = n => { const {y,m,d} = dd(n); return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`; };
const fromIso = s => { const p = (s||'').split('-').map(Number); return p.length===3 && p.every(Number.isFinite) ? dn(p[0],p[1]-1,p[2]) : null; };
let F = null;
function makeFormats(){
  const loc = LOCALE[lang], mk = o => new Intl.DateTimeFormat(loc, {timeZone:'UTC', ...o});
  const fDay = mk({day:'numeric', month:'short', year:'numeric'}), fMY = mk({month:'short', year:'numeric'}), fMS = mk({month:'short'}), fML = mk({month:'long'});
  const nf = new Intl.NumberFormat(loc, {useGrouping:false});
  const months = [...Array(12)].map((_,m) => new Date(Date.UTC(2021,m,1)));
  F = {
    day: n => { if (lang === 'uk'){ const {y,m,d} = dd(n); return `${d} ${UK_MON[m]} ${y}`; } return fDay.format(new Date(n*DAY)); },
    my: n => { if (lang === 'uk'){ const {y,m} = dd(n); return `${UK_MON[m]} ${y}`; } return fMY.format(new Date(n*DAY)); },
    mShort: lang === 'uk' ? UK_MON : months.map(d => fMS.format(d).replace(/\.$/,'')),
    mLong: months.map(d => fML.format(d)),
    num: x => nf.format(x),
  };
  F.mInit = F.mShort.map(s => [...s][0]);
}
makeFormats();
const fmt = n => F.day(n), fmtM = n => F.my(n);
const daysText = n => T.days(n, F.num(n));
const uid = () => Math.random().toString(36).slice(2,10);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const BAR_TOP = 22, BAR_H = 24;

/* ---------- line style of one period ----------
   Style flips at every day in `m`; `d` = the first piece is dashed. So solid → dashed → solid is m:[a,b], d:false. */
function fromK(s, e, k){ return k >= e ? {m:[], d:false} : k <= s ? {m:[], d:true} : {m:[k], d:false}; }
function fixMarks(seg){
  let m = (Array.isArray(seg.m) ? seg.m : []).filter(Number.isFinite).map(Math.round).sort((a,b) => a-b), d = !!seg.d;
  while (m.length && m[0] <= seg.s){ m.shift(); d = !d; }
  while (m.length && m[m.length-1] >= seg.e) m.pop();
  const out = []; for (const x of m){ if (out.length && out[out.length-1] === x) out.pop(); else out.push(x); }
  seg.m = out; seg.d = d;
}
function pieces(seg){ const b = [seg.s, ...seg.m, seg.e]; return b.slice(0,-1).map((a,i) => ({a, b:b[i+1], dash:(i % 2 === 1) !== seg.d})); }
function setPieces(seg, list){
  const merged = [];
  for (const p of list){ if (p.b <= p.a) continue; const l = merged[merged.length-1]; if (l && l.dash === p.dash) l.b = p.b; else merged.push({...p}); }
  if (!merged.length){ seg.m = []; seg.d = false; return; }
  seg.d = merged[0].dash; seg.m = merged.slice(1).map(p => p.a);
}
function styleText(seg){
  const ps = pieces(seg), dashed = ps.filter(p => p.dash);
  if (!dashed.length) return '';
  if (dashed.length === ps.length) return T.allUncertain;

/* ---------- undo + saving ---------- */
const undoStack = [];

const remote = { state:'pending', store:null, ref:null, inflight:false, pending:false, timer:null, lastJson:null, backupDay:null, unsub:null, warned:false };
let account = null;   /* filled by the account-based (github.io) build */
const statusEl = document.getElementById('status');
let statusKind = 'pending';
const savedKind = () => (account && account.anonymous) ? 'device' : 'saved';
function setStatus(kind){
  statusKind = kind;
  statusEl.className = 'status ' + kind;
  statusEl.querySelector('span').textContent = kind==='pending' ? '' : kind==='saving' ? T.stSaving : kind==='saved' ? T.stSaved : kind==='device' ? T.stDevice : T.stLocal;
  statusEl.title = kind==='local' ? T.stLocalTitle : kind==='device' ? T.stDeviceTitle : T.stCloudTitle;

function persist(){
  data.updatedAt = Date.now();

}
async function writeBackup(store){

/* store = { uid, doc(name) -> { get(), set(obj), onSnapshot(next, err) } } — the same shape for Claude's db and for Firestore */
async function connect(store, opts = {}){

/* ---------- geometry ---------- */
const $ = id => document.getElementById(id);

const ppd = () => trackW() / view.days;

const measure = document.createElement('canvas').getContext('2d');

/* ---------- render ---------- */

function renderTabs(){

  el.innerHTML = data.tabs.map(t => `<button class="tab${t.id===data.active?' on':''}" data-tab="${t.id}">${esc(tn(t))}</button>`).join('') +
    `<button class="tab-add" id="tabAdd" aria-label="${esc(T.newOrCopy)}" title="${esc(T.newOrCopy)}">+</button>`;

function renderRuler(){
  const p = ppd(), w = trackW(), d0 = Math.floor(view.start) - 1, d1 = Math.ceil(view.start + view.days) + 1;
  let h = '';
  for (let y = dd(d0).y; y <= dd(d1).y; y++){
    const a = X(dn(y,0,1)), b = X(dn(y+1,0,1)), left = Math.max(a,0), right = Math.min(b,w);
    if (right - left < 34) continue;
    h += `<span class="ry${b <= X(TODAY) ? ' past' : ''}" style="left:${left}px;width:${right-left}px;${a<0?'border-left-color:transparent':''}">${F.num(y)}</span>`;
  }
  const mw = p * 30.44, longW = Math.max(...F.mLong.map(s => textW(s, '12px Onest, system-ui'))) + 12, shortW = Math.max(...F.mShort.map(s => textW(s, '12px Onest, system-ui'))) + 8;
  const lab = mw >= longW ? m => F.mLong[m] : mw >= shortW ? m => F.mShort[m] : mw >= 13 ? m => F.mInit[m] : null;
  let {y, m} = dd(d0);
  for (let i=0; i<200; i++){
    const a = dn(y,m,1); if (a > d1) break;
    const xa = X(a), xb = X(dn(y,m+1,1));
    if (xb > 0) h += `<span class="rm${xb <= X(TODAY) ? ' past' : ''}" style="left:${xa}px;width:${xb-xa}px">${lab ? esc(lab(m)) : ''}</span>`;
    m++; if (m > 11){ m = 0; y++; }
  }
  const tx = X(TODAY + 0.5);
  if (p >= 9){
    for (let d=Math.floor(view.start); d<=d1; d++){
      const day = dd(d).d;
      if (Math.abs(X(d + 0.5) - tx) < 46) continue;
      if (p >= 20 || day === 1 || (day % 5 === 0 && day < 30)) h += `<span class="rd" style="left:${X(d)}px;width:${Math.max(p,18)}px">${F.num(day)}</span>`;
    }
  }
  if (tx > -40 && tx < w + 40) h += `<span class="rt" style="left:${tx}px">${esc(T.todayPill)}</span>`;
  const pastX = clamp(X(TODAY), 0, w);
  rulerEl.innerHTML = (pastX > 0 ? `<span class="rp" style="width:${pastX}px"></span>` : '') + h;

function drawGrid(){
  const w = trackW(), hgt = body.clientHeight, dpr = window.devicePixelRatio || 1;
  if (grid.width !== Math.round(w*dpr) || grid.height !== Math.round(hgt*dpr)){
    grid.width = Math.round(w*dpr); grid.height = Math.round(hgt*dpr); grid.style.width = w+'px'; grid.style.height = hgt+'px';
  }
  const g = grid.getContext('2d'), cs = getComputedStyle(document.documentElement), col = n => cs.getPropertyValue(n).trim();

  if (tx > 0){ g.fillStyle = col('--past'); g.fillRect(0,0,Math.min(tx,w),hgt); }
  const line = (xx, c, lw) => { const xs = Math.round(xx) + (lw % 2 ? .5 : 0); g.strokeStyle = c; g.lineWidth = lw; g.beginPath(); g.moveTo(xs,0); g.lineTo(xs,hgt); g.stroke(); };

/* One period of a task. Name + dates sit inside when they fit; otherwise the name floats just above the bar. */
function segHtml(item, s, nextX){

  const extra = (s.e <= TODAY ? ' past' : '') + (linking === s.id ? ' src' : '') + (liftedId === item.id ? ' lifted' : '') + (followIds.has(s.id) ? ' follows' : '');
  const visL = Math.max(L, 0), vis = Math.min(R, w) - visL, pad = 9;

  let inside = '', above = '';

  else if (vis >= nW + pad*2) inside = `<b>${esc(name)}</b>`;
  else {
    const maxW = Math.max(48, (nextX ?? w + 400) - visL - 10);

    bodyHtml +

    `<i class="h h-l" data-h="l"></i><i class="h h-r" data-h="r"></i>` + marks + `</div>`;

function rowHtml(t, r){

  let h = '';

  const rightOut = its.filter(it => it.segs.every(s => s.s >= vEnd)).sort((a,b) => a.segs[0].s - b.segs[0].s)[0];
  const chipTitle = it => esc(`${nm(it)}: ${fmtM(it.segs[0].s)} – ${fmtM(it.segs.at(-1).e-1)}`);

/* ---------- operations ---------- */
let linking = null, liftedId = null, followIds = new Set();
const newSegLen = () => Math.max(21, Math.round(140 / ppd()));
const gapLen = () => Math.max(14, Math.round(view.days / 12));
function pickColor(){
  const used = Array(8).fill(0); tab().items.forEach(i => used[((i.c%8)+8)%8]++);
  return used.indexOf(Math.min(...used));
}
function addTask(row, day){
  const t = tab(), n = rowCount(t);
  row = clamp(row ?? n, 0, n);
  const s = Math.floor(day ?? TODAY); let e = s + newSegLen();
  const next = t.items.filter(i => i.row === row).flatMap(i => i.segs).filter(x => x.s >= s).sort((a,b) => a.s - b.s)[0];
  if (next && next.s < e && next.s - s >= 5) e = next.s;
  pushUndo();
  const item = {id:uid(), k:'newTask', name:T.newTask, c:pickColor(), row, segs:[{id:uid(), s, e, m:[], d:false}]};
  t.items.push(item); settle(item); persist(); renderBoard();
  requestAnimationFrame(() => renameItem(item.id));
}
function addPeriod(item){
  const last = item.segs.at(-1), s = last.e + gapLen(), e = s + Math.max(30, newSegLen());
  pushUndo(); item.segs.push({id:uid(), s, e, m:[], d:false}); settle(item); ensureVisible({s, e}); persist(); schedule();
}
function deleteItem(item){
  pushUndo(); const t = tab(), ids = new Set(item.segs.map(s => s.id));
  t.items = t.items.filter(i => i !== item); t.links = t.links.filter(l => !ids.has(l.a) && !ids.has(l.b)); compact(t);
  persist(); schedule(); toast(T.tTaskDeleted(nm(item)), true);
}
function deleteSeg(item, seg){

  pushUndo(); item.segs = item.segs.filter(s => s !== seg); tab().links = tab().links.filter(l => l.a !== seg.id && l.b !== seg.id);
  persist(); schedule(); toast(T.tPeriodDeleted, true);
}
function splitSeg(item, seg, day){
  const cut = Math.round(day); if (cut <= seg.s || cut >= seg.e) return;
  const gap = gapLen();
  pushUndo();
  const ps = pieces(seg);
  const second = {id:uid(), s:cut + gap, e:seg.e + gap, m:[], d:false};
  setPieces(second, ps.filter(p => p.b > cut).map(p => ({a:Math.max(p.a, cut) + gap, b:p.b + gap, dash:p.dash})));
  setPieces(seg, ps.filter(p => p.a < cut).map(p => ({a:p.a, b:Math.min(p.b, cut), dash:p.dash}))); seg.e = cut; fixMarks(seg);
  tab().links.forEach(l => { if (l.a === seg.id) l.a = second.id; });
  item.segs.push(second); item.segs.sort((a,b) => a.s - b.s);
  const fs = followers([second.id]).filter(f => f.item !== item);
  fs.forEach(f => shiftSeg(f.seg, copySeg(f.seg), gap));
  settle(item, ...fs.map(f => f.item));
  persist(); schedule(); toast(T.tBreakAdded, true);
}
function ensureVisible(s){ if (X(s.e) < 0 || X(s.s) > trackW()) view.start = s.s - view.days * 0.15; }
function jumpTo(item, dir){
  if (dir === 'l') view.start = item.segs.at(-1).e - view.days * 0.75;
  else view.start = item.segs[0].s - view.days * 0.2;
  schedule();
}

const styleSelect = (dash, i) => `<select id="fStyle${i}" aria-label="${esc(T.lineLook)}"><option value="0"${dash?'':' selected'}>${esc(T.solid)}</option><option value="1"${dash?' selected':''}>${esc(T.dashed)}</option></select>`;
function pieceRow(i, at, dash){
  return `<div class="pr">` + (i === 0 ? `<span class="from">${esc(T.fromStart)}</span>` : `<input type="date" id="fAt${i}" value="${iso(at)}" aria-label="${esc(T.styleDateAria)}">`) +

/* ---------- context menus ---------- */
function segMenu(info, cx, cy){
  const f = segById(info.segId); if (!f) return;
  const {seg, item} = f, day = dayAt(info.px), t = tab();
  const items = [{label:T.mDates, run:() => openDates(item, seg)}];
  const ps = pieces(seg), dayR = Math.round(day);
  const pi = Math.max(0, ps.findIndex(p => day >= p.a && day < p.b)), piece = ps[pi];
  const restyle = fn => () => {
    pushUndo(); const oldE = seg.e, list = pieces(seg); fn(list); setPieces(seg, list); fixMarks(seg);
    const moved = shiftFollowers([seg.id], seg.e - oldE); settle(item, ...moved); persist(); schedule();
  };
  const extend = dash => restyle(list => { const len = Math.max(30, Math.round(view.days/5)); list.push({a:seg.e, b:seg.e + len, dash}); seg.e += len; });
  items.push('-', {label:T.mExtDash, run:extend(true)}, {label:T.mExtSolid, run:extend(false)});
  if (dayR > piece.a && dayR < piece.b)
    items.push({label:piece.dash ? T.mSolidFrom(fmt(dayR)) : T.mDashFrom(fmt(dayR)), run:restyle(list => { const p = list[pi]; list.splice(pi, 1, {a:p.a, b:dayR, dash:p.dash}, {a:dayR, b:p.b, dash:!p.dash}); })});
  if (ps.length > 1) items.push({label:piece.dash ? T.mPieceSolid : T.mPieceDash, run:restyle(list => { list[pi].dash = !list[pi].dash; })});
  if (ps.some(p => p.dash)) items.push({label:T.mAllSolid, run:restyle(list => { list.splice(0, list.length, {a:seg.s, b:seg.e, dash:false}); })});
  if (ps.some(p => !p.dash)) items.push({label:T.mAllDash, run:restyle(list => { list.splice(0, list.length, {a:seg.s, b:seg.e, dash:true}); })});
  items.push('-');
  if (day > seg.s + 2 && day < seg.e - 2) items.push({label:T.mBreak(fmt(dayR)), run:() => splitSeg(item, seg, day)});
  items.push({label:T.mAddPeriod, run:() => addPeriod(item)});
  items.push('-', {label:T.mLink, run:() => { linking = seg.id; showLinkChip(); schedule(); }});
  if (t.links.some(l => l.a === seg.id || l.b === seg.id)) items.push({label:T.mUnlink, run:() => { pushUndo(); t.links = t.links.filter(l => l.a !== seg.id && l.b !== seg.id); persist(); schedule(); }});
  items.push('-', {label:T.mRename, run:() => renameItem(item.id, seg.id)});
  if (item.segs.length > 1) items.push({label:T.mDelPeriod, danger:true, run:() => deleteSeg(item, seg)});
  items.push({label:T.mDelTask, danger:true, run:() => deleteItem(item)});
  openMenu(items, cx, cy, `${nm(item)} · ${fmtM(seg.s)} – ${fmtM(seg.e-1)}`);
}

  if (segEl) return {kind:'seg', segId:segEl.dataset.seg, h:t.dataset.h || null, mi:t.dataset.mi != null ? +t.dataset.mi : null, px};

}
let ptr = null, pinch = null, lastTap = null;
const pointers = new Map();

board.addEventListener('pointerdown', e => {
  if (e.target.closest('button, input, .chip')) return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (pointers.size === 2){ endPtr(false); const [a,b] = [...pointers.values()]; pinch = {d0:Math.hypot(a.x-b.x, a.y-b.y), days0:view.days, cx:(a.x+b.x)/2}; return; }
  if (pointers.size > 2) return;
  closeEditor(true);
  const info = hit(e);
  ptr = {id:e.pointerId, x0:e.clientX, y0:e.clientY, info, mode:null, touch:e.pointerType !== 'mouse', shift:e.shiftKey, alone:e.altKey};
  try { board.setPointerCapture(e.pointerId); } catch {}
  if (ptr.touch) ptr.lp = setTimeout(() => { if (ptr && !ptr.mode){ ptr.cancelled = true; contextFor(info, ptr.x0, ptr.y0); } }, 520);

board.addEventListener('pointermove', e => {
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});

    const [a,b] = [...pointers.values()], d = Math.hypot(a.x-b.x, a.y-b.y); if (d < 10) return;
    const px = pinch.cx - trackLeft(), under = dayAt(px);
    view.days = clamp(pinch.days0 * pinch.d0 / d, MIN_DAYS, MAX_DAYS); view.start = under - px / ppd(); schedule(); return;
  }

    clearTimeout(ptr.lp); beginDrag(dx, dy);
  }

});
function beginDrag(dx, dy){
  const i = ptr.info, f = i.kind === 'seg' && !linking ? segById(i.segId) : null;
  if (f){
    ptr.mode = i.h || 'move'; ptr.mi = i.mi; ptr.seg = f.seg; ptr.item = f.item;
    ptr.o = copySeg(f.seg); ptr.os = f.item.segs.map(copySeg);
    ptr.row0 = f.item.row; ptr.maxRow = rowCount(tab()); ptr.vlock = Math.abs(dy) > Math.abs(dx) * 1.5;
    ptr.deps = [];
    if (!ptr.alone && (ptr.mode === 'move' || ptr.mode === 'r')){
      const own = ptr.mode === 'move' && ptr.shift ? f.item.segs.map(s => s.id) : [f.seg.id];
      ptr.deps = followers(own).filter(x => !own.includes(x.seg.id)).map(x => ({f:x, o:copySeg(x.seg)}));
      followIds = new Set(ptr.deps.map(x => x.f.seg.id));
    }
    pushUndo(); if (ptr.mode === 'move') liftedId = f.item.id;
  } else {
    ptr.mode = 'pan'; ptr.o = {start:view.start, top:scroller.scrollTop};
  }
  board.style.cursor = ptr.mode === 'pan' || ptr.mode === 'move' ? 'grabbing' : 'ew-resize';
}
function applyDrag(e, dx, dy){
  const p = ppd(), dDays = Math.round(dx / p), m = ptr.mode;
  if (m === 'pan'){
    view.start = ptr.o.start - dx / p;
    if (ptr.info.kind !== 'ruler') scroller.scrollTop = ptr.o.top - dy;
    schedule(); return;
  }
  const s = ptr.seg, o = ptr.o;
  let delta = 0;
  if (m === 'move'){
    const rect = scroller.getBoundingClientRect();
    if (e.clientY < rect.top + 20) scroller.scrollTop -= 8; else if (e.clientY > rect.bottom - 20) scroller.scrollTop += 8;
    ptr.item.row = clamp(ptr.row0 + Math.round(dy / LH), 0, ptr.maxRow);
    if (!ptr.vlock){
      if (ptr.shift) ptr.item.segs.forEach((x,i) => shiftSeg(x, ptr.os[i], dDays));
      else shiftSeg(s, o, dDays);

    }
  }
  else if (m === 'l'){ s.s = Math.min(o.s + dDays, o.e - 1); s.e = o.e; s.m = [...o.m]; s.d = o.d; fixMarks(s); }
  else if (m === 'r'){ s.e = Math.max(o.e + dDays, o.s + 1); s.s = o.s; s.m = [...o.m]; s.d = o.d; fixMarks(s); delta = s.e - o.e; }
  else if (m === 'm'){
    const i = ptr.mi, lo = i > 0 ? o.m[i-1] : o.s, hi = i < o.m.length - 1 ? o.m[i+1] : o.e;
    const nv = clamp(o.m[i] + dDays, lo, hi);

  }
  (ptr.deps || []).forEach(x => shiftSeg(x.f.seg, x.o, delta));

}
function endPtr(isUp, e){
  if (!ptr) return;

    if (p.mode === 'pan'){ savePrefs(); return; }
    const same = p.item.row === p.row0 && p.item.segs.every((x,i) => x.s === p.os[i].s && x.e === p.os[i].e && x.d === p.os[i].d && x.m.join() === p.os[i].m.join());
    if (same) undoStack.pop();
    else { p.item.segs.sort((a,b) => a.s - b.s); settle(p.item, ...(p.deps || []).map(x => x.f.item)); persist(); }
    schedule(); return;
  }

}
board.addEventListener('pointerup', e => {
  pointers.delete(e.pointerId);
  if (pinch){ if (pointers.size < 2){ pinch = null; savePrefs(); } return; }
  if (ptr && ptr.id === e.pointerId) endPtr(true, e);
});
board.addEventListener('pointercancel', e => { pointers.delete(e.pointerId); if (pointers.size < 2) pinch = null; if (ptr && ptr.id === e.pointerId) endPtr(false); });

function tap(p, e){
  const i = p.info, now = performance.now();
  const key = i.kind + ':' + (i.segId ?? i.row ?? '');
  const isDouble = lastTap && now - lastTap.t < 380 && Math.hypot(e.clientX - lastTap.x, e.clientY - lastTap.y) < 14 && lastTap.key === key;
  lastTap = isDouble ? null : {t:now, x:e.clientX, y:e.clientY, key};
  if (linking){
    if (i.kind === 'seg' && i.segId !== linking){
      const t = tab();
      if (!t.links.some(l => l.a === linking && l.b === i.segId)){ pushUndo(); t.links.push({a:linking, b:i.segId}); persist(); }
      linking = null; hideToast(); lastTap = null; schedule();
    } else if (i.kind !== 'seg'){ linking = null; hideToast(); schedule(); }
    return;
  }
  if (!isDouble) return;
  if (i.kind === 'seg'){ const f = segById(i.segId); f && renameItem(f.item.id, i.segId); }
  else if (i.kind === 'row' || i.kind === 'empty') addTask(i.row, dayAt(i.px));
}
board.addEventListener('contextmenu', e => {
  if (e.target.closest('input, .chip, button')) return;
  e.preventDefault();
  if (ptr){ ptr.cancelled = true; clearTimeout(ptr.lp); }
  contextFor(hit(e), e.clientX, e.clientY);
});
let wheelSave = 0;
board.addEventListener('wheel', e => {
  if (e.ctrlKey || e.metaKey){
    e.preventDefault(); const px = e.clientX - trackLeft(), under = dayAt(px);
    view.days = clamp(view.days * Math.exp(e.deltaY * 0.0045), MIN_DAYS, MAX_DAYS); view.start = under - px / ppd();
    schedule(); clearTimeout(wheelSave); wheelSave = setTimeout(savePrefs, 400); return;
  }
  const unit = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? 400 : 1;
  let dx = e.deltaX * unit, dy = e.deltaY * unit;
  const canScrollY = scroller.scrollHeight > scroller.clientHeight + 1;
  if (!dx && (e.shiftKey || !canScrollY || e.target.closest('.ruler'))){ dx = dy; dy = 0; }
  if (dx && Math.abs(dx) >= Math.abs(dy)){ e.preventDefault(); view.start += dx / ppd(); schedule(); }
}, {passive:false});
rowsEl.addEventListener('click', e => {

function saveFile(filename, text){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type:'application/json'})); a.download = filename;
  document.body.appendChild(a); a.click();

function syncAccountUI(){

/* email link: 'send' asks for the address; 'confirm' is shown when the link is opened on another device */
const emailModal = $('emailModal'), emailInput = $('emailInput'), emailErr = $('emailErr');
let emailMode = 'send';
function openEmail(mode){
  emailMode = mode;
  $('emailTitle').textContent = mode === 'send' ? T.signInEmail : T.emailConfirm;
  $('emailSub').textContent = mode === 'send' ? T.signInWhy : '';

  emailErr.hidden = true; emailModal.hidden = false; emailInput.value = lsGet('obrii-email') || ''; emailInput.focus();
}
const closeEmail = () => { emailModal.hidden = true; if (emailMode === 'confirm') cloudReady.then(c => c.ensureGuest()); };

}

    catch { emailErr.textContent = T.signInFailed; emailErr.hidden = false; }

});

/* anonymous visit statistics: asked first in Europe, on by default elsewhere */
function setupConsent(cloud){
  let tz = ''; try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch {}
  const ask = tz.startsWith('Europe/');
  if (prefs.stats === 'yes' || (!ask && prefs.stats !== 'no')){ cloud.analytics(); return; }
  if (prefs.stats === 'no') return;
  const bar = $('consent'); bar.hidden = false;
  $('consentYes').onclick = () => { prefs.stats = 'yes'; savePrefs(); bar.hidden = true; cloud.analytics(); };
  $('consentNo').onclick = () => { prefs.stats = 'no'; savePrefs(); bar.hidden = true; };
}
cloudReady.then(cloud => {
  cloud.onUser(u => {
    const prev = account; account = u; syncAccountUI();
    if (remote.store && remote.store.uid === u.uid) return;

  setupConsent(cloud);
}).catch(() => { remote.state = 'off'; setStatus('local'); });

<script type="module">
/* Firebase bridge for Обрій on github.io: guest start, Google or email-link sign-in, per-person Firestore storage. */

  apiKey: "AIzaSyCzlHpRH0CfRqramzzobFnu7sOFCcmc9fA",

const listeners = [];

  listeners.forEach(f => f(current));

const wrapSnap = s => ({exists:s.exists(), data:() => s.data()});

window.obriiCloud = {
  onUser(fn){ listeners.push(fn); if (current) fn(current); },
  storeFor(uid){
    return { uid, doc(name){
      const r = doc(db, 'users', uid, 'obrii', name);
      return {
        get: async () => wrapSnap(await getDoc(r)),
        set: obj => setDoc(r, obj),

  },
};
